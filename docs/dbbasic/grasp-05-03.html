    ],
    rows: [
      {사번:1001, 이름:'김민준', 직급:'부장', 부서번호:1, 상사사번:null},
      {사번:1002, 이름:'이서연', 직급:'부장', 부서번호:2, 상사사번:null},
      {사번:1003, 이름:'박도윤', 직급:'사원', 부서번호:1, 상사사번:1001},
      {사번:1004, 이름:'최지우', 직급:'과장', 부서번호:3, 상사사번:null},
      {사번:1005, 이름:'정하준', 직급:'대리', 부서번호:2, 상사사번:1002},
      {사번:1006, 이름:'한예린', 직급:'사원', 부서번호:null, 상사사번:1001},

let db, ridSeq = 1;
function resetDB(){
  db = JSON.parse(JSON.stringify(SEED));
  for (const t of Object.values(db)) t.rows.forEach(r => r.__rid = ridSeq++);
}
resetDB();

class SqlError extends Error {}
const KW = new Set(['SELECT','FROM','WHERE','AND','OR','NOT','INSERT','INTO','VALUES','UPDATE','SET','DELETE',
  'ORDER','BY','ASC','DESC','LIMIT','JOIN','INNER','LEFT','RIGHT','FULL','OUTER','CROSS','ON','LIKE','AS','NULL','IS','COUNT']);

function tokenize(src){
  const toks = [];
  const re = /\s+|--[^\n]*|'((?:[^']|'')*)'|"((?:[^"]|"")*)"|(-?\d+(?:\.\d+)?)|([\p{L}_][\p{L}\p{N}_]*)|(<=|>=|<>|!=|==|[=<>(),.*;])/uy;
  let i = 0;
  while (i < src.length){
    re.lastIndex = i;
    const m = re.exec(src);
    if (!m){
      if (src[i] === "'" || src[i] === '"') throw new SqlError(`따옴표(${src[i]})가 열렸는데 닫히지 않았어요. 글자 값은 '김민준' 처럼 앞뒤를 모두 감싸 주세요.`);
      throw new SqlError(`'${src[i]}' 기호는 이해하지 못했어요.`);
    }
    i = re.lastIndex;
    if (m[1] !== undefined) toks.push({t:'str', v:m[1].replace(/''/g,"'")});
    else if (m[2] !== undefined) toks.push({t:'str', v:m[2].replace(/""/g,'"')});
    else if (m[3] !== undefined) toks.push({t:'num', v:Number(m[3])});
    else if (m[4] !== undefined){
      const up = m[4].toUpperCase();
      if (KW.has(up)) toks.push({t:'kw', v:up}); else toks.push({t:'id', v:m[4]});
    }
    else if (m[5] !== undefined) toks.push({t:'sym', v: m[5]==='==' ? '=' : m[5]});
  }
  return toks;
}

function parse(src){
  const toks = tokenize(src);
  let p = 0;
  const peek = () => toks[p];
  const isKw = k => toks[p] && toks[p].t==='kw' && toks[p].v===k;
  const isSym = s => toks[p] && toks[p].t==='sym' && toks[p].v===s;
  const eatKw = k => { if (isKw(k)){ p++; return true; } return false; };
  const eatSym = s => { if (isSym(s)){ p++; return true; } return false; };
  const near = () => toks[p] ? ` ('${toks[p].v}' 근처)` : ' (문장 끝)';
  const needKw = (k, msg) => { if (!eatKw(k)) throw new SqlError((msg || `여기에 ${k} 가 와야 해요.`) + near()); };
  const needSym = (s, msg) => { if (!eatSym(s)) throw new SqlError((msg || `여기에 '${s}' 기호가 와야 해요.`) + near()); };
  const ident = what => {
    const t = toks[p];
    if (t && t.t==='id'){ p++; return t.v; }
    throw new SqlError(`여기에 ${what} 이름이 와야 해요.` + near());
  };
  const colref = () => {
    const a = ident('열(칸)');
    if (eatSym('.')) return {k:'col', table:a, col:ident('열(칸)')};
    return {k:'col', col:a};
  };
  function expr(){ return orE(); }
  function orE(){ let l = andE(); while (eatKw('OR')) l = {k:'or', l, r:andE()}; return l; }
  function andE(){ let l = notE(); while (eatKw('AND')) l = {k:'and', l, r:notE()}; return l; }
  function notE(){ if (eatKw('NOT')) return {k:'not', e:notE()}; return cmp(); }
  function cmp(){
    const l = prim();
    if (eatKw('IS')){ const neg = eatKw('NOT'); needKw('NULL', 'IS 다음에는 NULL(비어 있음)이 와야 해요.'); return {k:'isnull', e:l, neg}; }
    let neg = false;
    if (isKw('NOT') && toks[p+1] && toks[p+1].v==='LIKE'){ p++; neg = true; }
    if (eatKw('LIKE')) return {k:'like', l, r:prim(), neg};
    const t = peek();
    if (t && t.t==='sym' && ['=','!=','<>','<','>','<=','>='].includes(t.v)){ p++; return {k:'cmp', op:t.v, l, r:prim()}; }
    return l;
  }
  function prim(){
    const t = peek();
    if (!t) throw new SqlError('문장이 중간에 끝났어요. 뒤에 무언가가 더 있어야 해요.');
    if (t.t==='num' || t.t==='str'){ p++; return {k:'lit', v:t.v}; }
    if (isKw('NULL')){ p++; return {k:'lit', v:null}; }
    if (eatSym('(')){ const e = expr(); needSym(')', "괄호 ')' 가 닫히지 않았어요."); return e; }
    if (t.t==='id') return colref();
    throw new SqlError(`'${t.v}'는 이 자리에 올 수 없어요.`);
  }

  let stmt;
  if (eatKw('SELECT')){
    const items = [];
    do {
      let it;
      if (eatSym('*')) it = {k:'star'};
      else if (eatKw('COUNT')){
        needSym('(', "COUNT 다음에는 '(' 가 와야 해요. 예: COUNT(*)");
        let cc = null;
        if (!eatSym('*')) cc = colref();
        needSym(')', "COUNT( 의 괄호가 닫히지 않았어요.");
        it = {k:'count', col:cc};
      } else it = {k:'expr', e:colref()};
      if (eatKw('AS')) it.as = ident('별명');
      items.push(it);
    } while (eatSym(','));
    needKw('FROM', 'SELECT 로 보여줄 칸을 적은 다음에는 FROM 표이름 이 와야 해요.');
    const from = ident('표');
    const alias = () => { if (eatKw('AS')) return ident('별명'); const t = peek(); if (t && t.t==='id'){ p++; return t.v; } return null; };

      let type = 'inner';
      if (eatKw('LEFT')) type = 'left'; else if (eatKw('RIGHT')) type = 'right'; else if (eatKw('FULL')) type = 'full'; else if (eatKw('CROSS')) type = 'cross'; else eatKw('INNER');
      if (type==='left' || type==='right' || type==='full') eatKw('OUTER');
      needKw('JOIN', `${type.toUpperCase()} 다음에는 JOIN 이 와야 해요.`);
      const t = ident('표');
      const as = alias();
      let on = null;
      if (type!=='cross'){ needKw('ON', 'JOIN 표이름 다음에는 ON 으로 어떤 기준으로 짝을 맞출지 적어야 해요.'); on = expr(); }
      joins.push({table:t, as, type, on});

    if (eatKw('WHERE')) where = expr();

      needKw('BY', 'ORDER 다음에는 BY 가 와야 해요. (ORDER BY)');
      do { const c = colref(); let desc = false; if (eatKw('DESC')) desc = true; else eatKw('ASC'); order.push({c, desc}); } while (eatSym(','));
    }
    if (eatKw('LIMIT')){ const t = peek(); if (!t || t.t!=='num') throw new SqlError('LIMIT 다음에는 숫자가 와야 해요.'); p++; limit = t.v; }

  }

    needKw('INTO', 'INSERT 다음에는 INTO 가 와야 해요. (INSERT INTO)');
    const table = ident('표');
    let cols = null;
    if (eatSym('(')){ cols = []; do cols.push(ident('열(칸)')); while (eatSym(',')); needSym(')'); }
    needKw('VALUES', '입력할 값 앞에는 VALUES 가 와야 해요.');
    const tuples = [];
    do {
      needSym('(', "VALUES 다음에는 ( 값, 값, ... ) 모양으로 적어요.");
      const vals = [];
      do {
        const t = peek();
        if (t && (t.t==='num' || t.t==='str')){ p++; vals.push(t.v); }
        else if (isKw('NULL')){ p++; vals.push(null); }
        else if (t && t.t==='id') throw new SqlError(`'${t.v}' 가 무엇인지 모르겠어요. 글자 값이라면 '${t.v}' 처럼 작은따옴표로 감싸 주세요.`);

    const table = ident('표');
    needKw('SET', 'UPDATE 표이름 다음에는 SET 열 = 값 이 와야 해요.');
    const sets = [];
    do { const c = ident('열(칸)'); needSym('=', "SET 열 다음에는 '=' 가 와야 해요."); sets.push({col:c, e:prim()}); } while (eatSym(','));
    let where = null;
    if (eatKw('WHERE')) where = expr();
    stmt = {type:'update', table, sets, where};
  }
  else if (eatKw('DELETE')){
    needKw('FROM', 'DELETE 다음에는 FROM 이 와야 해요. (DELETE FROM 표이름)');
    const table = ident('표');
    let where = null;
    if (eatKw('WHERE')) where = expr();
    stmt = {type:'delete', table, where};
  }
  else {
    const t = peek();
    if (!t) throw new SqlError('아무것도 적혀 있지 않아요.');
    throw new SqlError(`문장은 SELECT, INSERT, UPDATE, DELETE 중 하나로 시작해야 해요. ('${t.v}'로 시작했어요)`);
  }
  eatSym(';');
  if (p < toks.length) throw new SqlError(`문장이 끝났어야 하는데 뒤에 더 있어요.` + near());
  return stmt;
}

function getTable(name){
  if (!db[name]) throw new SqlError(`'${name}'(이)라는 표는 없어요. 있는 표: ${Object.keys(db).join(', ')}`);
  return db[name];
}
/* 받침에 맞는 조사 고르기: josa('개발팀','을','를') → '개발팀을' */
function josa(word, a, b){
  const w = String(word).replace(/['")\s]+$/,''), ch = w.charCodeAt(w.length-1);
  let jong;
  if (ch>=0xAC00 && ch<=0xD7A3) jong = (ch-0xAC00)%28 !== 0;
  else if (/[0-9]$/.test(w)) jong = '013678'.includes(w.slice(-1));

}
const pkCols = t => t.columns.filter(c => c.pk);
const label = (t, r) => r.이름 != null ? `'${r.이름}'` : pkCols(t).map(c => `${c.name} ${r[c.name]}`).join(', ');

}
function cmpVals(a, b){

function qualify(tname, r){

}
function resolve(row, ref){
  if (ref.table){
    const key = ref.table+'.'+ref.col;
    if (key in row) return row[key];
    if (!db[ref.table]) throw new SqlError(`'${ref.table}'(이)라는 표는 없어요.`);
    throw new SqlError(`'${ref.table}' 표가 이 문장에 없거나, '${ref.col}' 열이 없어요.`);
  }
  const keys = Object.keys(row).filter(k => k!=='__src' && k.slice(k.indexOf('.')+1)===ref.col);
  if (keys.length===1) return row[keys[0]];
  if (keys.length===0) throw new SqlError(`'${ref.col}'(이)라는 열(칸)이 없어요. 혹시 글자 값이라면 '${ref.col}' 처럼 작은따옴표로 감싸 주세요.`);
  throw new SqlError(`'${ref.col}'이(가) 어느 표의 열인지 헷갈려요. ${keys.join(' 또는 ')} 처럼 표 이름을 붙여 주세요.`);

function evalE(e, row){

function coerce(col, v){

    if (col.required) throw new SqlError(`'${col.name}' 칸은 꼭 채워야 해요.`);
    return null;

    if (n===null) throw new SqlError(`'${col.name}' 열에는 숫자만 입력할 수 있어요. '${v}'은(는) 숫자가 아니에요.`);

function checkKeys(t, finalRows, changed){

      const dup = finalRows.find(x => x!==r && key(x)===key(r));

    if (!c.ref || c.ref.table!==tname) continue;
    const rows = t.rows.filter(x => !ignore.includes(x) && x[c.name]!=null && cmpVals(x[c.name], row[c.ref.col])===0);
    if (rows.length) out.push({table:tn, col:c.name, rows});

const refMsg = (tname, row, refs, verb) => {
  const f = refs[0];

  return `${tname} 표의 ${josa(label(db[tname],row),'은','는')} ${f.table} 표의 ${f.rows.length}줄(${names})과 연결되어 있어서 ${verb} 수 없어요. 연결이 끊어지면 그 줄들이 갈 곳을 잃거든요.`;

function executeBase(sql){
  const s = parse(sql);
  if (s.type==='select'){
    const base = getTable(s.from);
    let rows = base.rows.map(r => qualify(s.from, r));
    let colKeys = base.columns.map(c => s.from+'.'+c.name);
    const used = [s.from];
    for (const j of s.joins){
      const jt = getTable(j.table);
      if (used.includes(j.table)) throw new SqlError('같은 표를 두 번 연결하는 건 이 체험에서는 지원하지 않아요.');
      used.push(j.table);
      const out = [];
      for (const a of rows) for (const r of jt.rows){
        const b = qualify(j.table, r);
        const m = {...a, ...b, __src:{...a.__src, ...b.__src}};
        if (evalE(j.on, m)) out.push(m);
      }
      rows = out;
      colKeys = colKeys.concat(jt.columns.map(c => j.table+'.'+c.name));
    }
    const probe = {}; colKeys.forEach(k => probe[k]=null);
    const check = e => { if (!e) return; if (e.k==='col') resolve(probe, e); ['l','r','e'].forEach(x => e[x] && check(e[x])); };
    check(s.where); s.order.forEach(o => check(o.c)); s.items.forEach(it => { it.e && check(it.e); it.col && check(it.col); });
    if (s.where) rows = rows.filter(r => evalE(s.where, r));
    if (s.order.length){
      rows.sort((x,y) => {
        for (const o of s.order){
          const a = resolve(x,o.c), b = resolve(y,o.c);
          if (a==null && b==null) continue;
          if (a==null) return 1; if (b==null) return -1;
          const c = cmpVals(a,b); if (c) return o.desc ? -c : c;
        }
        return 0;
      });
    }
    if (s.limit!==null) rows = rows.slice(0, s.limit);
    if (s.items.some(i => i.k==='count')){
      if (s.items.length>1) throw new SqlError('이 체험에서는 COUNT는 혼자만 쓸 수 있어요. 예: SELECT COUNT(*) FROM 직원');
      const it = s.items[0];
      const n = it.col ? rows.filter(r => resolve(r, it.col)!=null).length : rows.length;
      return {kind:'select', columns:[it.as || '개수'], rows:[[n]], srcs:[{}], count:true, message:`조건에 맞는 줄은 모두 ${n}개예요.`};
    }
    const shortName = k => k.slice(k.indexOf('.')+1);
    const dup = n => colKeys.filter(k => shortName(k)===n).length > 1;
    const cols = [];
    for (const it of s.items){
      if (it.k==='star') colKeys.forEach(k => cols.push({label: dup(shortName(k)) ? k : shortName(k), get: r => r[k]}));
      else cols.push({label: it.as || (it.e.table && dup(it.e.col) ? it.e.table+'.'+it.e.col : it.e.col), get: r => resolve(r, it.e)});
    }
    return {kind:'select', columns:cols.map(c=>c.label), rows:rows.map(r => cols.map(c => c.get(r))), srcs:rows.map(r=>r.__src),
      message: rows.length ? `${rows.length}줄을 찾았어요.` : '조건에 맞는 줄이 하나도 없어요.'};
  }
  if (s.type==='insert'){
    const t = getTable(s.table), pks = pkCols(t);
    const cols = s.cols ? s.cols.map(n => { const c = t.columns.find(c=>c.name===n); if (!c) throw new SqlError(`'${s.table}' 표에는 '${n}' 열이 없어요.`); return c; }) : t.columns;
    const newRows = [];
    for (const vals of s.tuples){
      if (vals.length !== cols.length) throw new SqlError(`열은 ${cols.length}개인데 값은 ${vals.length}개예요. 개수가 같아야 해요.`);
      const r = {};
      t.columns.forEach(c => r[c.name] = null);
      cols.forEach((c,i) => r[c.name] = coerce(c, vals[i]));
      t.columns.forEach(c => { if (!cols.includes(c)) coerce(c, null); });
      newRows.push(r);
    }
    checkKeys(t, t.rows.concat(newRows), newRows);
    newRows.forEach(r => r.__rid = ridSeq++);
    t.rows.push(...newRows);
    return {kind:'change', op:'insert', table:s.table, ids:newRows.map(r=>r.__rid), message:`${s.table} 표에 ${newRows.length}줄을 새로 입력했어요.`};
  }
  if (s.type==='update'){
    const t = getTable(s.table);
    const setCols = s.sets.map(st => {
      const c = t.columns.find(c=>c.name===st.col);
      if (!c) throw new SqlError(`'${s.table}' 표에는 '${st.col}' 열이 없어요.`);
      return c;

    const clones = new Map();
    for (const r of targets){
      const n = {...r};
      s.sets.forEach((st,j) => n[st.col] = coerce(setCols[j], evalE(st.e, qualify(s.table, r))));
      for (const c of setCols){
        if (cmpVals(r[c.name], n[c.name])===0) continue;
        const refs = referrers(s.table, r).filter(f => db[f.table].columns.find(x=>x.name===f.col).ref.col===c.name);
        if (refs.length) throw new SqlError(refMsg(s.table, r, refs, '바꿀'));
      }
      clones.set(r, n);
    }
    checkKeys(t, t.rows.map(r => clones.get(r) || r), [...clones.values()]);
    targets.forEach(r => Object.assign(r, clones.get(r)));
    return {kind:'change', op:'update', table:s.table, ids:targets.map(r=>r.__rid), noWhere:!s.where,
      message: targets.length ? `${s.table} 표에서 ${targets.length}줄을 고쳤어요.` : '조건에 맞는 줄이 없어서 아무것도 바뀌지 않았어요.'};
  }
  if (s.type==='delete'){
    const t = getTable(s.table);
    const before = t.rows.length;
    const gone = t.rows.filter(r => !s.where || evalE(s.where, qualify(s.table, r)));
    for (const r of gone){ const refs = referrers(s.table, r, gone); if (refs.length) throw new SqlError(refMsg(s.table, r, refs, '지울')); }
    t.rows = t.rows.filter(r => !gone.includes(r));
    return {kind:'change', op:'delete', table:s.table, ids:[], removed:gone, noWhere:!s.where,
      message: gone.length ? `${s.table} 표에서 ${gone.length}줄을 지웠어요. (${before}줄 → ${t.rows.length}줄)` : '조건에 맞는 줄이 없어서 아무것도 지워지지 않았어요.'};
  }
}

/* ---- JOIN 전용: 별명(AS), 바깥 조인(LEFT/RIGHT/FULL), CROSS ---- */
function qualify(tname, r, alias){
  alias = alias || tname;
  const o = {__src:[[tname, r.__rid]], __pad:new Set()};
  for (const c of db[tname].columns) o[alias+'.'+c.name] = r[c.name];
  return o;
}
function resolveKey(row, ref){
  if (ref.table){
    const key = ref.table+'.'+ref.col;
    if (key in row) return key;
    if (!Object.keys(row).some(k => k.startsWith(ref.table+'.')))
      throw new SqlError(`'${ref.table}'(이)라는 표(또는 별명)가 이 문장에 없어요.`);
    throw new SqlError(`'${ref.table}' 표에는 '${ref.col}' 열이 없어요.`);
  }
  const keys = Object.keys(row).filter(k => k.includes('.') && k.slice(k.indexOf('.')+1)===ref.col);
  if (keys.length===1) return keys[0];
  if (keys.length===0) throw new SqlError(`'${ref.col}'(이)라는 열(칸)이 없어요. 혹시 글자 값이라면 '${ref.col}' 처럼 작은따옴표로 감싸 주세요.`);
  throw new SqlError(`'${ref.col}'이(가) 어느 표의 열인지 헷갈려요. ${keys.join(' 또는 ')} 처럼 표 이름을 붙여 주세요.`);

function resolve(row, ref){ return row[resolveKey(row, ref)]; }
const merge = (a, b) => ({...a, ...b, __src:[...a.__src, ...b.__src], __pad:new Set([...a.__pad, ...b.__pad])});
function checkRefs(e, probe){ if (!e) return; if (e.k==='col') resolveKey(probe, e); ['l','r','e'].forEach(x => e[x] && checkRefs(e[x], probe)); }

function execute(sql){
  const s = parse(sql);
  if (s.type!=='select') return executeBase(sql);
  const base = getTable(s.from), fn = s.fromAs || s.from;
  let rows = base.rows.map(r => qualify(s.from, r, fn));
  let colKeys = base.columns.map(c => fn+'.'+c.name);
  const used = [fn];
  let padded = 0;
  for (const j of s.joins){
    const jt = getTable(j.table), jn = j.as || j.table;
    if (used.includes(jn)) throw new SqlError(`'${jn}' 표를 두 번 쓰고 있어요. 같은 표를 한 번 더 이으려면 AS 로 별명을 붙여 주세요. 예: JOIN ${j.table} AS 상사`);
    const rKeys = jt.columns.map(c => jn+'.'+c.name);
    if (j.on){ const probe = {}; colKeys.concat(rKeys).forEach(k => probe[k]=null); checkRefs(j.on, probe); }
    const right = jt.rows.map(r => qualify(j.table, r, jn));
    const out = [], hit = new Set();
    for (const a of rows){
      let any = false;
      for (const b of right){
        const m = merge(a, b);
        if (j.type==='cross' || evalE(j.on, m)){ out.push(m); any = true; hit.add(b); }
      }

      const pad = {__src:[], __pad:new Set(used)}; colKeys.forEach(k => pad[k]=null);
      out.push(merge(pad, b));
    }
    used.push(jn);
    rows = out; colKeys = colKeys.concat(rKeys);
  }

  checkRefs(s.where, probe); s.order.forEach(o => checkRefs(o.c, probe)); s.items.forEach(it => { checkRefs(it.e, probe); checkRefs(it.col, probe); });
  if (s.where) rows = rows.filter(r => evalE(s.where, r));
  if (s.order.length){
    rows.sort((x,y) => {
      for (const o of s.order){
        const a = resolve(x,o.c), b = resolve(y,o.c);
        if (a==null && b==null) continue;
        if (a==null) return 1; if (b==null) return -1;
        const c = cmpVals(a,b); if (c) return o.desc ? -c : c;
      }
      return 0;
    });
  }
  if (s.limit!==null) rows = rows.slice(0, s.limit);
  if (s.items.some(i => i.k==='count')){
    if (s.items.length>1) throw new SqlError('이 체험에서는 COUNT는 혼자만 쓸 수 있어요. 예: SELECT COUNT(*) FROM 직원');
    const it = s.items[0];
    const n = it.col ? rows.filter(r => resolve(r, it.col)!=null).length : rows.length;
    return {kind:'select', columns:[it.as || '개수'], rows:[[n]], pads:[[false]], srcs:[[]], count:true, message:`조건에 맞는 줄은 모두 ${n}개예요.`};
  }
  const shortName = k => k.slice(k.indexOf('.')+1);
  const dup = n => colKeys.filter(k => shortName(k)===n).length > 1;
  const cols = [];
  for (const it of s.items){
    if (it.k==='star') colKeys.forEach(k => cols.push({label: dup(shortName(k)) ? k : shortName(k), key: () => k}));
    else cols.push({label: it.as || (dup(it.e.col) && it.e.table ? it.e.table+'.'+it.e.col : it.e.col), key: r => resolveKey(r, it.e)});
  }
  padded = rows.filter(r => r.__pad.size).length;
  const isPad = (r, k) => r.__pad.has(k.slice(0, k.indexOf('.')));
  return {kind:'select', columns:cols.map(c=>c.label),
    rows:rows.map(r => cols.map(c => r[c.key(r)])),
    pads:rows.map(r => cols.map(c => isPad(r, c.key(r)))),
    srcs:rows.map(r => r.__src),
    message: (rows.length ? `${rows.length}줄이 만들어졌어요.` : '만들어진 줄이 하나도 없어요.') + (padded ? ` 그중 ${padded}줄은 짝이 없어서 빈자리를 (짝 없음)으로 채웠어요.` : '')};
}

function highlightMany(map){

function highlightSrcs(list){   // [[[표, rid], ...], ...]

function resultTable(res){
  let h = `<div class="scroll"><table><thead><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
  res.rows.forEach((r,i) => h += `<tr data-i="${i}">${r.map((v,j) => cell(v, res.pads[i][j])).join('')}</tr>`);
  if (!res.rows.length) h += `<tr><td colspan="${res.columns.length}" class="null">결과 없음</td></tr>`;
  return h + '</tbody></table></div>';

function run(sql, out, opts={}){
  let res;
  try { res = execute(sql); }
  catch (e){
    if (!(e instanceof SqlError)) console.error(e);
    out.innerHTML = `<div class="msg err">🚫 ${esc(e.message)}</div>`;
    log(sql, false);
    opts.after && opts.after(null, e);
    return null;
  }
  log(sql, true);
  if (res.kind==='select'){
    out.innerHTML = `<div class="result"><div class="msg info">🔎 ${esc(res.message)}</div>${res.rows.length || res.count ? resultTable(res) : ''}</div>`;
    if (!res.count) highlightSrcs(res.srcs); else { hl = {}; renderDB(); }
    out.querySelectorAll('tr[data-i]').forEach(tr => {
      tr.addEventListener('mouseenter', () => highlightSrcs([res.srcs[+tr.dataset.i]]));
      tr.addEventListener('mouseleave', () => highlightSrcs(res.srcs));
    });
  } else {
    out.innerHTML = `<div class="msg ok">✅ ${esc(res.message)}</div>`;
    hl = {}; if (res.table && res.ids) hl[res.table] = new Map(res.ids.map(id => [id, 'flash']));
    renderDB();
  }
  opts.after && opts.after(res);
  return res;
}

const PCOLS = [
  {key:'a이름', t:'A', col:'이름'},

let pick = null;     // 눌러서 고른 칸 {t, rid, col}
let prac = null;     // {mode, rows:[{aRid, cells:{}, status}], cur}
const aRow = rid => db.A.rows.find(r => r.__rid===rid);
const bMatch = a => a.부서번호==null ? null : db.B.rows.find(b => b.ID===a.부서번호) || null;
function practiceHTML(mode){

function startPractice(mode){
  prac = {mode, rows: db.A.rows.map(r => ({aRid:r.__rid, cells:{}, status:'open'}))};

function rowDone(pr){
  const a = aRow(pr.aRid), m = bMatch(a);
  const aOk = pr.cells.a이름!==undefined && pr.cells.a부서번호!==undefined;
  if (pr.status==='removed') return true;
  if (pr.status==='nulled') return aOk;

}
function drawPractice(){
  const curIdx = prac.rows.findIndex(r => !rowDone(r));
  let h = `<thead><tr><th></th>${PCOLS.map(c => `<th class="${c.t==='A'?'a':'b'}"><span class="${c.t==='A'?'tA':'tB'}">${c.t}</span>.${c.col}</th>`).join('')}<th></th></tr></thead><tbody>`;

      if (!pick){ say('err', '먼저 오른쪽 표에서 옮길 칸을 눌러 고르세요. (노란색으로 표시돼요)'); return; }

function say(kind, html){ const m = $('#pracMsg'); m.className = 'msg ' + kind; m.innerHTML = html; }
function place(src, i, key, td){
  const pr = prac.rows[i], exp = PCOLS.find(c => c.key===key), a = aRow(pr.aRid), m = bMatch(a);
  const fail = msg => { say('err', '❌ ' + msg); td.classList.remove('bad'); void td.offsetWidth; td.classList.add('bad'); };
  if (!src || !db[src.t]) return;
  const srow = db[src.t].rows.find(r => r.__rid===src.rid);
  if (!srow) return;
  const sname = src.t==='A' || src.t==='B' ? src.t : src.t;
  if (src.t!==exp.t || src.col!==exp.col)
    return fail(`이 칸에는 <span class="${exp.t==='A'?'tA':'tB'}">${exp.t} 테이블</span>의 <b>${exp.col}</b> 값을 넣어야 해요. 지금 옮긴 건 ${esc(sname)} 테이블의 ${esc(src.col)} 값이에요.`);
  if (exp.t==='A' && srow!==a)
    return fail(`이 줄은 A의 ${i+1}번째 줄(<b>${esc(a.이름)}</b>)의 결과예요. ${esc(srow.이름)}의 값이 아니라 ${esc(a.이름)}의 값을 옮겨 주세요.`);
  if (exp.t==='B'){
    if (!m) return fail(`${esc(a.이름)}의 부서번호는 <b>${a.부서번호==null ? '비어 있어요' : a.부서번호}</b>. B 테이블에는 이 줄과 짝이 되는 ID가 없어요. <b>[짝이 없어요]</b> 버튼을 눌러 보세요.`);
    if (srow!==m) return fail(`그건 B에서 ID가 <b>${srow.ID}</b>인 줄의 값이에요. ${esc(a.이름)}의 부서번호는 <b>${a.부서번호}</b>이니까, B에서 <b>ID가 ${a.부서번호}</b>인 줄을 찾아야 해요.`);
  }
  pr.cells[key] = srow[src.col];
  pick = null;
  renderDB();
  drawPractice();
  if (key==='a부서번호' && m) say('info', `👍 ${esc(a.이름)}의 부서번호는 <b>${a.부서번호}</b>! 이제 <span class="tB">B 테이블</span>에서 <b>ID가 ${a.부서번호}</b>인 줄을 찾아 ID, 부서명, 위치를 옮겨 보세요.`);
  else if (key==='a부서번호' && !m) say('info', `🤔 ${esc(a.이름)}의 부서번호는 <b>비어 있어요</b>. B 테이블에서 짝을 찾을 수 있을까요?`);
  else if (rowDone(pr)) say('ok', `✅ A의 ${i+1}번째 줄 완성! ${esc(a.이름)}(부서번호 ${a.부서번호}) + B의 ID ${m.ID} 줄이 합쳐져서 한 줄이 됐어요.`);

}
function noMatch(i){

  if (prac.mode==='inner'){

    say('ok', `✅ 맞아요. ${josa(esc(a.이름),'은','는')} 부서번호가 비어 있어서 B에 짝이 없어요. "짝이 있는 줄만" 남기는 방법이라 <b>이 줄은 결과에서 빠져요</b>.`);

}
function checkFinish(){
  if (!prac.rows.every(rowDone)) return;

    💡 기준 없이 모든 짝을 만드는 것도 쓸 데가 있어요. 예를 들어 옷 색깔 표 × 사이즈 표 = 모든 상품 조합 목록.</div>
    <p class="muted sql-only">기준은 SQL에서 <b>ON</b> 뒤에 써요. 기준 없이 모든 짝을 만드는 건 <b>CROSS JOIN</b>이에요.</p>`; },
    init(){ initExp(CROSS_EXP); } },

  { name:'겹치는 것만', render(){ return `
    <h2>${venn(0,1,0)} 겹치는 것만<span class="sql-only"> (INNER JOIN)</span></h2>
    <p>가장 기본이 되는 JOIN이에요. <b>양쪽 다 짝이 있는 줄만</b> 결과에 남아요. 실습에서 짝이 없던 한예린의 줄이 빠졌던 것, 기억나죠?</p>
    <p>그림의 왼쪽 원은 직원, 오른쪽 원은 부서예요. 가운데 <b>겹친 부분</b> = 짝이 맞는 것들만 결과가 돼요.</p>
    ${expCards(INNER_EXP)}
    <div class="tip">💡 결과 줄에 마우스를 올리면 오른쪽에서 어느 두 줄이 합쳐졌는지 보여요.</div>
    <p class="muted sql-only">그냥 <b>JOIN</b>이라고만 쓰면 INNER JOIN이에요.</p>`; },
    init(){ initExp(INNER_EXP); } },

  { name:'왼쪽은 모두', tables:['A','B'], drag:true, render(){ return `
    <h2>${venn(1,1,0,'A','B')} 왼쪽은 모두<span class="sql-only"> (LEFT JOIN)</span></h2>
    <p>"짝이 없어도 <b>왼쪽(먼저 적은) 표의 줄은 버리지 말자</b>"는 JOIN이에요. 짝이 없는 줄은 오른쪽 칸을 <b>(짝 없음)</b>으로 비워 두고 남겨요.</p>
    <h3>✋ 다시 직접 만들어 보기</h3>
    <p>이번엔 A의 줄을 하나도 빼지 않고 결과를 만들어 보세요. 짝이 없는 줄에서 <b>[짝이 없어요]</b>를 누르면 B 쪽만 비워져요.</p>
    ${practiceHTML('left')}
    <h3>데이터베이스에게 시켜 보기</h3>
    ${expCards(LEFT_EXP)}`; },
    init(){
      initPractice('left');
      initExp(LEFT_EXP);
    },
    onCell(info){ pick = {t:info.table, rid:info.id, col:info.col}; renderDB(); say('info', `✋ <b>${esc(info.table)} 테이블의 ${esc(info.col)}</b> 칸을 골랐어요. 이제 왼쪽 결과 표에서 넣을 자리를 누르세요.`); },
    leave(){ pick = null; } },

  { name:'오른쪽 · 양쪽 모두', render(){ return `
    <div class="vennRow">
      <div class="vennCard">${venn(0,1,1)}<small>오른쪽은 모두<span class="sql-only"> (RIGHT JOIN)</span></small></div>
      <div class="vennCard">${venn(1,1,1)}<small>양쪽 모두<span class="sql-only"> (FULL OUTER JOIN)</span></small></div>
    </div>
    <h2>오른쪽은 모두 · 양쪽 모두</h2>
    <p><b>오른쪽은 모두</b>는 왼쪽은 모두의 거울이에요. 나중에 적은(오른쪽) 표가 짝이 없어도 모두 남아요.
    <b>양쪽 모두</b>는 짝이 없는 줄을 양쪽에서 다 남겨요.</p>
    ${expCards(RF_EXP)}`; },
    init(){ initExp(RF_EXP); } },

  { name:'한눈에 비교', render(){ return `
    <h2>🔍 네 가지 JOIN 한눈에 비교</h2>
    <p>그림을 눌러 보세요. 같은 직원 · 부서 표를 방법만 바꿔서 붙이면 결과가 어떻게 달라지는지 바로 볼 수 있어요.</p>
    <div class="vennRow" id="cmp">${Object.keys(JT).map(k => `<div class="vennCard click" data-k="${k}">${venn(...JT[k].v)}<small><b>${jtName(k)}</b><br>${JT[k].desc}</small></div>`).join('')}</div>
    <div class="sql" id="cmpSql"></div>
    <div id="cmpOut"></div>
    <div class="scroll"><table class="compare" id="cmpCount"></table></div>
    <h3>문제! 어떤 JOIN을 써야 할까요?</h3>
    ${PICK_QUIZ.map((q,i) => `<div class="quiz" id="pq${i}"><div class="q">${q.q}</div>
      <div class="row">${Object.keys(JT).map(k => `<button class="btn ghost small" data-a="${k}">${JT[k].ko}</button>`).join('')}</div><div class="out"></div></div>`).join('')}`; },
    init(){
      const sqlOf = k => `SELECT 직원.이름 AS 직원, 부서.이름 AS 부서\nFROM 직원 ${JT[k].kw} 부서\n${ON_STD}`;
      const show = k => {
        document.querySelectorAll('#cmp .vennCard').forEach(c => c.classList.toggle('on', c.dataset.k===k));
        $('#cmpSql').innerHTML = sqlHTML(sqlOf(k));
        run(sqlOf(k), $('#cmpOut'));
      };
      document.querySelectorAll('#cmp .vennCard').forEach(c => c.onclick = () => show(c.dataset.k));
      const counts = Object.keys(JT).map(k => { try { return execute(sqlOf(k)).rows.length; } catch(e){ return '-'; } });
      $('#cmpCount').innerHTML = `<thead><tr><th>방법</th>${Object.keys(JT).map(k => `<th>${JT[k].ko}</th>`).join('')}</tr></thead>
        <tbody><tr><td>결과 줄 수</td>${counts.map(n => `<td><b>${n}</b>줄</td>`).join('')}</tr></tbody>`;

        $(`#pq${i} .out`).innerHTML = `<div class="msg ${ok?'ok':'err'}">${ok?'정답!':`아쉬워요. 정답은 <b>${JT[q.ans].ko}</b>`} — ${q.why}</div>`;
      }));
    } },

  { name:'세 표 이상 붙이기', tables:['직원','부서','프로젝트','참여'], render(){ return `
    <h2>🔗🔗 세 표, 네 표도 줄줄이 붙여요</h2>
    <p>JOIN은 두 표에서 끝나지 않아요. 붙인 결과에 또 다른 표를 <b>이어서</b> 붙일 수 있어요. 기차를 한 칸씩 연결하는 것처럼요.</p>
    <p>오른쪽의 <b>참여</b> 표는 "누가 어떤 프로젝트에 참여하나"를 적은 표예요. 사번은 직원 표를, 프로젝트번호는 프로젝트 표를 가리켜요.</p>
    ${expCards(MULTI_EXP)}
    <div class="tip">💡 붙일 때마다 <b>기준을 하나씩</b> 정해요. 표가 3개면 기준 2개, 4개면 기준 3개예요.</div>`; },
    init(){ initExp(MULTI_EXP); } },

  { name:'같은 표끼리 붙이기', tables:['직원'], render(){ return `
    <h2>🪞 같은 표끼리 붙이기</h2>
    <p>직원 표의 <b>상사사번</b>은 같은 직원 표의 사번을 가리켜요. "박도윤의 상사 이름"을 알려면 직원 표를 <b>직원 표와</b> 붙여야 해요.</p>
    <p>같은 표가 두 번 나오면 헷갈리니까, 두 번째 직원 표에는 <b>'상사'라는 별명</b>을 붙여서 구분해요.
    마치 같은 명단을 두 장 복사해서, 한 장에는 "직원", 한 장에는 "상사"라고 써 붙인 것과 같아요.</p>
    ${expCards(SELF_EXP)}
    <p class="muted sql-only">별명은 <b>AS</b> 뒤에 써요. 예: <b>JOIN 직원 AS 상사</b></p>`; },
    init(){ initExp(SELF_EXP); } },

  { name:'직접 SQL 써 보기', sqlOnly:true, tables:['A','B','직원','부서','프로젝트','참여'], render(){ return `
    <h2>⌨️ JOIN을 직접 써 보세요</h2>
    <p>아래에 SQL을 적고 <b>실행</b>을 누르세요. (Ctrl + Enter 도 돼요) 예시를 누르면 바로 실행돼요.</p>
    <textarea id="free">SELECT A.이름, A.부서번호, B.ID, B.부서명, B.위치\nFROM A JOIN B\nON A.부서번호 = B.ID</textarea>
    <div class="row"><button class="btn" id="freeBtn">실행</button><button class="btn ghost small" id="clearBtn">지우기</button></div>
    <div id="freeOut"></div>
    <h3>예시</h3>
    <div class="examples">${EXAMPLES.map(e=>`<button>${esc(e)}</button>`).join('')}</div>
    <h3>짧은 사전</h3>
    <div class="cheat">
      <code>FROM 왼쪽표 JOIN 오른쪽표 ON 기준</code><span>겹치는 것만 (INNER JOIN)</span>
      <code>LEFT JOIN</code><span>왼쪽은 모두</span>
      <code>RIGHT JOIN</code><span>오른쪽은 모두</span>
      <code>FULL OUTER JOIN</code><span>양쪽 모두</span>
      <code>CROSS JOIN</code><span>기준 없이 모든 짝 (ON 없음)</span>
      <code>표.칸</code><span>어느 표의 칸인지 밝혀 쓰기</span>
      <code>JOIN 표 AS 별명</code><span>같은 표를 두 번 쓸 때 별명 붙이기</span>
      <code>WHERE 오른쪽표.칸 IS NULL</code><span>LEFT JOIN 뒤에 짝이 없는 줄만 고르기</span>
    </div>
    <h3>실행 기록</h3>
    <div class="history" id="history">${renderHistory()}</div>`; },
    init(){
      const go1 = () => run($('#free').value, $('#freeOut'));
      $('#freeBtn').onclick = go1;
      $('#clearBtn').onclick = () => { $('#free').value=''; $('#free').focus(); };
      $('#free').onkeydown = e => { if (e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); go1(); } };
      document.querySelectorAll('.examples button').forEach(b => b.onclick = () => { $('#free').value = b.textContent; go1(); });
    } },

  { name:'정리', render(){ return `
    <h2>🎉 JOIN 정리</h2>
    <p><b>JOIN</b> = 나눠 담은 표를 <b>기준</b>에 따라 짝 맞춰 한 줄로 붙이기. 여러분이 손으로 했던 그 일이에요.</p>
    <div class="vennRow">${Object.keys(JT).map(k => `<div class="vennCard">${venn(...JT[k].v)}<small><b>${jtName(k)}</b><br>${JT[k].desc}</small></div>`).join('')}</div>
    <div class="gloss">

      <b>왼쪽 / 오른쪽</b><span>먼저 적은 표가 왼쪽, 나중에 붙인 표가 오른쪽</span>
      <b>(짝 없음)</b><span>바깥쪽까지 남기는 JOIN에서 짝이 없을 때 비워 두는 자리</span>
      <b>여러 표 붙이기</b><span>붙인 결과에 계속 이어 붙여요. 붙일 때마다 기준이 하나씩</span>
      <b>같은 표끼리</b><span>한쪽에 별명을 붙여서 구분해요 (직원 ↔ 상사)</span>
      <b>모든 짝</b><span>기준 없이 붙이면 줄 수 × 줄 수 만큼의 모든 조합이 생겨요</span>

    </div>
    <h3>JOIN을 고르는 법</h3>

      <li>한쪽 표는 하나도 빠지면 안 돼요 → 그 표를 먼저 적고 <b>왼쪽은 모두</b></li>
      <li>양쪽 다 빠지면 안 돼요 → <b>양쪽 모두</b></li>

    init(){ $('#again').onclick = () => { resetDB(); hl = {}; go(0); }; } },
];

/* =========================================================
   5. 단계 이동
   ========================================================= */
let cur = 0;
const visited = new Set([0]);
const visibleSteps = () => STEPS.map((s,i)=>i).filter(i => sqlOn || !STEPS[i].sqlOnly);
function stepLabel(i){ return `${visibleSteps().indexOf(i)+1}. ${STEPS[i].name}`; }
function renderNav(){
  const vis = visibleSteps(), k = vis.indexOf(cur), prev = vis[k-1], next = vis[k+1];
  $('#nav').innerHTML = `
      <button class="btn ghost" id="prev" ${prev===undefined?'disabled':''}>← 이전</button>
      ${next!==undefined ? `<button class="btn" id="next">다음: ${STEPS[next].name} →</button>` : ''}`;
  if (prev!==undefined) $('#prev').onclick = () => go(prev);
  if (next!==undefined) $('#next').onclick = () => go(next);
}
function applySql(){
  document.body.classList.toggle('sql-off', !sqlOn);
  $('#sqlToggle').checked = sqlOn;
  try { localStorage.setItem('db-exp-sql', sqlOn ? '1' : '0'); } catch(e){}
}
function go(i){
  STEPS[cur].leave && STEPS[cur].leave.call(STEPS[cur]);
  cur = i; visited.add(i);
  hl = {};
  const s = STEPS[i];
  $('#lesson').innerHTML = s.render() + `<div class="nav" id="nav"></div>`;
  renderNav();
  renderDB();
  s.init && s.init.call(s);
  renderSteps();
  window.scrollTo({top:0, behavior:'smooth'});
}
function renderSteps(){
  $('#steps').innerHTML = visibleSteps().map(i => `<button class="${i===cur?'on':visited.has(i)?'done':''}" data-i="${i}">${stepLabel(i)}</button>`).join('');
  document.querySelectorAll('#steps button').forEach(b => b.onclick = () => go(+b.dataset.i));
}
$('#dbView').addEventListener('click', e => {
  const td = e.target.closest('td[data-c]'); if (!td) return;
  const s = STEPS[cur];
  if (s.onCell) s.onCell.call(s, {table: td.closest('table').dataset.t, id: +td.parentElement.dataset.id, col: td.dataset.c});
});
$('#resetBtn').onclick = () => { resetDB(); hl = {}; go(cur); };
$('#sqlToggle').onchange = e => {
  sqlOn = e.target.checked; applySql();
  if (!sqlOn && STEPS[cur].sqlOnly){ const vis = visibleSteps(); go(vis.find(i => i > cur) ?? vis[vis.length-1]); }
  else { renderSteps(); renderNav(); }
};
applySql();
go(0);
</script>
